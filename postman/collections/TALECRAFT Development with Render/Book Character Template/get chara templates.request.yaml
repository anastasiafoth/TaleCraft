$kind: http-request
name: get chara templates
url: "{{dev_url}}/api/books/3/character-templates"
method: GET
body:
  type: json
  content: |-
    {
        "role": "pet",
        "default_name": "mouse",
        "default_gender": "female",
        "default_main_color": "white"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 1000
